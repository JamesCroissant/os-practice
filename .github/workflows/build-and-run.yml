name: Build and run under QEMU

"on":
  push:
  pull_request:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-misc gcc-riscv64-linux-gnu \
            binutils-riscv64-linux-gnu opensbi

      - name: Build
        run: |
          make clean
          make 2>&1 | tee build.log
          # -Wall -Wextra is expected to stay silent (every journal entry's
          # own "Verified:" paragraph checks this by hand) -- grep
          # specifically for a compiler warning line (kernel.c:LINE:COL:
          # warning: ... or kernel.h:LINE:COL: warning: ...), not just the
          # substring "warning", since the linker's own pre-existing "LOAD
          # segment with RWX permissions" warning is expected and
          # unrelated. Both source files, not just kernel.c: GCC attributes
          # a diagnostic to wherever the offending code actually sits, so
          # a warning inside one of kernel.h's own inline functions or
          # macro bodies (READ_CSR/WRITE_CSR, say, or a future addition)
          # is reported as "kernel.h:...", not "kernel.c:..." -- confirmed
          # directly by temporarily adding an unused-variable-producing
          # inline function to a throwaway header and observing GCC's own
          # warning named *that* header, not kernel.c. A kernel.c-only
          # grep would have silently let such a warning through.
          if grep -qE '^kernel\.(c|h):[0-9]+:[0-9]+: warning:' build.log; then
            echo "New compiler warning(s) found:" >&2
            grep -E '^kernel\.(c|h):[0-9]+:[0-9]+: warning:' build.log >&2
            exit 1
          fi

      # Boots the actual kernel and checks the same invariants this
      # project's own daily review already checks by hand on every change:
      # no panic, and the thread behavior kernel_main sets up for all
      # eight threads it creates (D/U/V each a single clean run of 5, W
      # interleaved 5 times rather than bunched, A/B/C/E kept alive and
      # interleaving) stays correct. Scripting this turns "verified under
      # QEMU" from a claim made in a commit message into something CI
      # itself confirms on every push, not just on whichever change this
      # account happened to review by hand that day.
      - name: Run under QEMU and verify thread behavior
        run: |
          timeout 5 qemu-system-riscv32 -machine virt -m 128M \
            -bios /usr/lib/riscv32-linux-gnu/opensbi/generic/fw_dynamic.bin \
            -nographic -serial file:out.log -monitor none -kernel kernel.elf \
            || true

          if grep -q PANIC out.log; then
            echo "Kernel panicked:" >&2
            grep PANIC out.log >&2
            exit 1
          fi

          if ! grep -q "Hello World!" out.log; then
            echo "Kernel never reached kernel_main's own Hello World -- didn't boot" >&2
            exit 1
          fi

          # Thread output only, excluding both OpenSBI's own startup
          # banner and kernel_main's own "Hello World!" greeting line --
          # the latter needs excluding too, not just the former: it has a
          # stray 'W' of its own (in "World!") that would otherwise count
          # toward user_entry3's 5 real 'W's below. `{f=1} f` (no `next`)
          # sets the flag and then, on that very same line, lets it print
          # anyway -- the exact off-by-one this comment already claimed
          # not to have; `next` actually excludes the matching line itself.
          awk '/Hello World!/{f=1; next} f' out.log > thread_output.log

          # V (user_entry2) is the same shape as D/U: its own comment in
          # kernel.c calls "DDDDD"/"UUUUU"/"VVVVV" each one clean,
          # contiguous run the exact invariant every prior step's QEMU
          # capture checks for -- this loop checked D and U but silently
          # left V, one of the eight threads kernel_main actually creates,
          # unverified.
          for letter in D U V; do
            runs="$(grep -o "${letter}\{1,20\}" thread_output.log)"
            count="$(echo "$runs" | grep -c .)"
            if [ "$count" -ne 1 ] || [ "$runs" != "$(printf "${letter}%.0s" 1 2 3 4 5)" ]; then
              echo "Expected exactly one run of 5 '$letter's, got: $runs" >&2
              exit 1
            fi
          done

          for letter in A B C E; do
            if ! grep -q "$letter" thread_output.log; then
              echo "Thread '$letter' never printed anything -- scheduler starved it" >&2
              exit 1
            fi
          done

          # W (user_entry3) exercises SYS_YIELD -- user_entry3's own comment
          # says its 5 'W's should come out interleaved with A/B/C/E, not
          # bunched into one contiguous run like D/U/V, as the actual proof
          # that the yield syscall transferred control rather than silently
          # returning. Checking the count alone (as D/U/V's loop already
          # does for its own letters) wouldn't catch a regression that
          # broke SYS_YIELD into a no-op: that would still print exactly 5
          # W's, just as one contiguous "WWWWW" run.
          w_count="$(grep -o "W" thread_output.log | wc -l)"
          if [ "$w_count" -ne 5 ]; then
            echo "Expected exactly 5 'W's, got $w_count" >&2
            exit 1
          fi
          if grep -q "WWWWW" thread_output.log; then
            echo "Expected 'W's interleaved with other threads (SYS_YIELD actually yielding), got one unbroken run of 5" >&2
            exit 1
          fi

          echo "No panic, D/U/V each one clean run of 5, W interleaved 5 times, A/B/C/E all present."
